  application-type: "Corporate"
  language-id: "001"
  user-type: "1"
  checksum-algorithm: "SHA-512"
  encryption-algorithm: "AES-256"
  encryption-key-hex: "79244226452948404D635166546A576E5A7234753777217A25432A462D4A614E"
  cipher-transformation: "AES/ECB/PKCS5Padding"